version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./repositories:/app/repositories
      - ./art.db:/app/art.db
    environment:
      - RUST_LOG=info
    restart: unless-stopped

