{% extends "base/layout.html" %}

{% block content %}
<div class="user-form-container">
    <h1 class="page-title">Register</h1>

    {% if error %}
    <div class="alert alert-error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/user/register" class="form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   pattern="^[a-zA-Z0-9_-]{3,30}$"
                   title="Username must be 3-30 characters, using only letters, numbers, underscores, and hyphens">
            <small class="form-help">3-30 characters. Letters, numbers, underscores, and hyphens only.</small>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="display_name">Display Name</label>
            <input type="text" id="display_name" name="display_name" required>
            <small class="form-help">Your public display name</small>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   minlength="8"
                   title="Password must be at least 8 characters">
            <small class="form-help">Minimum 8 characters</small>
        </div>

        <div class="form-group">
            <label for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Register</button>
        </div>

        <div class="form-footer">
            <p>Already have an account? <a href="/user/login">Login</a></p>
        </div>
    </form>
</div>
{% endblock %}
