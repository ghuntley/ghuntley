groups:
  - name: art_alerts
    rules:
      - alert: HighErrorRate
        expr: job:http_requests_errors:ratio_rate5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is above 5% for the past 5 minutes for {{ $labels.job }}"

      - alert: SlowResponses
        expr: job:http_request_duration_seconds:avg5m > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow HTTP responses detected"
          description: "Average response time is above 1 second for the past 10 minutes for {{ $labels.job }}, method {{ $labels.method }}, path {{ $labels.path }}"

      - alert: HighMemoryUsage
        expr: memory_usage_bytes > 1000000000 # 1GB
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 1GB for the past 15 minutes for {{ $labels.job }}"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute"

      - alert: HighCacheMissRate
        expr: job:cache_efficiency:ratio < 0.7
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High cache miss rate detected"
          description: "Cache hit ratio is below 70% for {{ $labels.cache }} in {{ $labels.job }}"

      - alert: RapidMemoryGrowth
        expr: job:memory_usage_bytes:deriv5m > 10000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rapid memory growth detected"
          description: "Memory is growing by more than 10MB per second for the past 10 minutes for {{ $labels.job }}"
