[build]
rustflags = ["-C", "target-cpu=native"]

[bench]
harness = false

[profile.bench]
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = false
lto = "thin"
incremental = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
debug-assertions = false
overflow-checks = false
lto = "thin"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = true
