[package]
name = "art"
version = "0.1.0"
edition = "2021"
description = "A Git repository browser inspired by cgit"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/your-username/art"

[dependencies]
# Web framework and HTTP server
axum = { version = "0.6.20", features = ["headers", "multipart"] }
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["compression-gzip", "cors", "trace", "fs"] }
tokio = { version = "1.32.0", features = ["full"] }
hyper = { version = "0.14.27", features = ["full"] }
tower-cookies = "0.9.0"
http = "0.2.9"

# HTTP client (for outgoing requests)
reqwest = { version = "0.11.20", features = ["json"] }

# Git integration
git2 = "0.18.1"
gix = "0.55.2"

# Database
# Use rusqlite directly instead of sqlx for simplicity
rusqlite = { version = "0.29.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.22.0"

# Template engine
askama = "0.12.1"

# Serialization and deserialization
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
toml = "0.8.2"
csv = "1.2.2"

# Time handling
chrono = { version = "0.4.31", features = ["serde"] }
time = "0.3.28"
cron = "0.12.0"

# Error handling
thiserror = "1.0.49"
anyhow = "1.0.75"

# Logging
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

# Command line interface
clap = { version = "4.4.6", features = ["derive"] }

# Testing
proptest = "1.2.0"
proptest-derive = "0.4.0"

# Authentication and validation
validator = { version = "0.16.1", features = ["derive"] }
async-trait = "0.1.73"

# Email
lettre = { version = "0.10.4", features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder"] }

# Utilities
moka = { version = "0.12.1", features = ["future"] }
once_cell = "1.18.0"
num_cpus = "1.16.0"
futures = "0.3.28"
urlencoding = "2.1.3"
mime_guess = "2.0.4"
csscolorparser = "0.6.2"
regex = "1.10.2"
lazy_static = "1.4.0"
uuid = { version = "1.3.0", features = ["v4"] }
rand = "0.8.5"
base64 = "0.21.0"
parking_lot = "0.12.1"
tempfile = "3.6.0"
bytes = "1.5.0"
sha2 = "0.10.7"
percent-encoding = "2.3.0"
flate2 = "1.0.28"
sysinfo = "0.30.0"

# Metrics and observability
prometheus = { version = "0.13.3", features = ["process"] }
opentelemetry = { version = "0.20.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.13.0", features = ["http-proto", "reqwest-client"] }

# Syntax highlighting
syntect = "5.1.0"

[dev-dependencies]
proptest = "1.2.0"
criterion = "0.5"
tokio-test = "0.4.2"
test-log = { version = "0.2.12", features = ["trace"] }
axum-test = { version = "14.0.0-rc.1" }
mockall = "0.11.3"
httpmock = "0.6.8"
pretty_assertions = "1.4.0"
reqwest = { version = "0.11.20", features = ["json"] }
scraper = "0.18.1"
