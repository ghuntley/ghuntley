[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2021"]
includes = ["*.rs"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = [
  "*.js",
  "*.ts",
  "*.json",
  "*.md",
  "*.yaml",
  "*.yml"
]
excludes = [
  "flake.lock",
  "Cargo.lock",
  "**/node_modules/**",
  "**/target/**"
]
